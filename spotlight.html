<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AFUHSD Resource Widget (Filter Edition)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;1,700&display=swap" rel="stylesheet">

  <style>
    :root{
      --card-gap: 16px;
      --radius: 16px;
      --text: #111827;
      --muted: #6b7280;
      --link: #2563eb;
      --btn-gray: #e5e7eb;
      --btn-gray-hover: #d1d5db;
      --active-blue: #2563eb;
      --shadow: 0 4px 12px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    }

    html, body {
      margin: 0; padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: transparent;
      color: var(--text);
      overflow: auto;
    }

    .carousel-wrap {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
    }

    .header-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .carousel-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topbar-title {
      margin: 0;
      font-family: "Poppins", system-ui, -apple-system, sans-serif;
      font-size: 18pt;
      font-weight: 700;
      color: #1c4587;
    }

    .filter-nav {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s, color 0.2s;
    }
    .filter-btn:hover {
      background: #eef2f7;
      color: var(--text);
    }

    .filter-btn.active {
      background: #eef2f7;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(17,24,39,0.08);
    }

    .controls-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .control-btn {
      border: 0;
      background: var(--btn-gray);
      color: var(--text);
      height: 40px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
      text-decoration: none;
    }
    .control-btn:hover { background: var(--btn-gray-hover); }

    .nav-btn { width: 40px; font-size: 1.2rem; }
    .view-all-btn { padding: 0 16px; font-size: 0.9rem; box-sizing: border-box; }

    .carousel {
      display: grid;
      gap: var(--card-gap);
      padding-bottom: 20px;
      grid-auto-flow: column;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }
    .carousel::-webkit-scrollbar { display: none; }

    @media(min-width: 900px) {
      .carousel { grid-auto-columns: calc((100% - (2 * var(--card-gap))) / 3); }
    }
    @media(max-width: 899px) and (min-width: 640px) {
      .carousel { grid-auto-columns: calc((100% - var(--card-gap)) / 2); }
    }
    @media(max-width: 639px) {
      .carousel { grid-auto-columns: 85%; }
    }

    .carousel.is-grid {
      grid-auto-flow: row;
      grid-template-columns: repeat(3, 1fr);
      overflow-x: visible;
      padding-bottom: 0;
    }
    @media(max-width: 899px) { .carousel.is-grid { grid-template-columns: repeat(2, 1fr); } }
    @media(max-width: 500px) { .carousel.is-grid { grid-template-columns: 1fr; } }

    .card {
      scroll-snap-align: start;
      background: #f0f3f8;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      height: auto;
      min-height: 320px;
    }
    .card.hidden {
      display: none;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .card-media {
      background: #f3f4f6;
      position: relative;
      flex-shrink: 0;
      width: 100%;
      height: 0;
      padding-top: 56.25%;
      overflow: hidden;
    }
    .card-media img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge {
      position: absolute; top: 10px; left: 10px;
      background: #111827; color: #fff;
      padding: 4px 10px; font-size: 0.75rem; font-weight: 700;
      border-radius: 99px;
      z-index: 2;
    }
    /* The kind badge — what SORT of thing this is (use case, video, prompt).
       Goes to the opposite corner from the category badge so the two never
       collide. Hidden entirely if the kind list can't be fetched. */
    .kind-badge {
      position: absolute; top: 10px; right: 10px;
      background: #6b7280; color: #fff;
      padding: 4px 10px; font-size: 0.75rem; font-weight: 700;
      border-radius: 99px;
      z-index: 2;
    }
    .badge[data-tool="chatgpt"] { background: #14b8a6; }
    .badge[data-tool="canva"]   { background: #7c3aed; }
    .badge[data-tool="word"]    { background: #2563eb; }
    .badge[data-tool="forms"]   { background: #16a34a; }
    .badge[data-tool="notebooklm"] { background: #000; }

    .card-body { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { margin: 0 0 8px; font-size: 1.5rem; font-weight: 600; }
    .card-desc { margin: 0 0 16px; font-size: 1rem; color: var(--muted); line-height: 1.4; flex-grow: 1; }

    .card-link {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 1.3rem; font-weight: 600; color: var(--link);
      text-decoration: none;
      margin-top: auto;
      padding: 5px 0;
    }
    .card-link:hover .arrow { transform: translateX(4px); transition: transform 0.2s; }

    .loading-msg, .error-msg {
      padding: 40px 10px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .error-msg { color: #b91c1c; }
  </style>
</head>
<body>

  <section class="carousel-wrap">

    <div class="header-stack">
      <div class="carousel-topbar">
        <h2 class="topbar-title">AI SPOTLIGHT</h2>

        <div class="controls-group" id="controlsGroup">
          <a id="viewAllBtn" class="control-btn view-all-btn" target="_blank" rel="noopener">View All</a>
          <button id="prevBtn" class="control-btn nav-btn">&lt;</button>
          <button id="nextBtn" class="control-btn nav-btn">&gt;</button>
        </div>
      </div>

      <div class="filter-nav" id="filterNav">
        <button class="filter-btn active" data-filter="all">All</button>
      </div>
    </div>

    <div class="carousel" id="carousel">
      <div class="loading-msg" id="loadingMsg">Loading resources…</div>
    </div>
  </section>

  <script>
    /* =========================================================
       !!! CONFIGURATION SECTION !!!
       ========================================================= */

    // MODE: 'carousel' OR 'grid'
    const MODE = 'carousel';

    // SHOW FILTER BAR? (true or false)
    const SHOW_FILTER_NAV = true;

    // STARTING FILTER: 'all', 'chatgpt', 'canva', 'word', 'forms', etc.
    const INITIAL_CATEGORY = 'all';

    // WHICH KINDS TO SHOW.
    //
    //   'all'                 every kind (the main hub view)
    //   ['usecase']           a use-cases-only page
    //   ['video','prompt']    any combination
    //
    // A "kind" is what sort of thing a resource is, as opposed to what it's
    // about — the current list lives in Config.js in the CMS and is served at
    // <deployment URL>?page=kinds. Records saved before kinds existed have no
    // kind field at all and count as 'article', so nothing older ever
    // disappears by accident.
    //
    // This is only the DEFAULT. Any page can override it from the embed URL,
    // so one copy of this file serves every page:
    //
    //   <iframe src=".../spotlight.html?kinds=usecase">
    //   <iframe src=".../spotlight.html?kinds=video,prompt">
    //   <iframe src=".../spotlight.html">          uses the default below
    //
    // Prefer the query string over editing this line — a second copy of the
    // file is a second thing to keep up to date.
    const KINDS_SHOWN = 'all';

    // SHOW THE KIND BADGE ON EACH CARD? Useful when a page mixes kinds;
    // pointless on a page already filtered to one kind.
    const SHOW_KIND_BADGE = true;

    // Used only if the kinds endpoint can't be reached — same situation as
    // FALLBACK_CATEGORIES below, i.e. the viewer isn't signed into their
    // aguafria.org account. Without this the badges would silently vanish for
    // exactly the people most likely to be reading from outside the domain.
    //
    // NOTE: filtering by KINDS_SHOWN does NOT depend on this. That reads the
    // kind straight out of cards.json, so a use-cases-only page stays correct
    // even when this list is what's in use.
    const FALLBACK_KINDS = [
      { kind: 'usecase', label: 'Use Case', color: '#7c3aed' },
      { kind: 'article', label: 'Article',  color: '#2563eb' },
      { kind: 'video',   label: 'Video',    color: '#dc2626' },
      { kind: 'prompt',  label: 'Prompt',   color: '#059669' },
      { kind: 'skill',   label: 'Skill',    color: '#ea580c' },
      { kind: 'chatbot', label: 'Chatbot',  color: '#0891b2' }
    ];

    // The View All Link
    const VIEW_ALL_URL = 'https://sites.google.com/aguafria.org/ai-hub/spotlight';

    // Where the card data lives. Editing cards.json on GitHub is the ONLY
    // step needed to add/update/remove cards — this file never needs to change.
    const CARDS_JSON_URL = 'https://raw.githubusercontent.com/afhsd-ai-innovation/ai-hub-page-widgets/main/cards.json';

    // The filter buttons are built dynamically from the same Categories sheet
    // used everywhere else in the AI Hub, so this file never drifts out of
    // sync when a category is added/renamed/removed.
    const CATEGORIES_URL = 'https://script.google.com/a/macros/aguafria.org/s/AKfycbx13FWuxaxgD93A_wbfHU_j5EGBk_suTbQ-xcrYRx29mlIiNtFX0UDfhJsyBag9OdDR/exec?page=categories';

    // The kind list, from the same CMS config, so the badge labels and colours
    // here never drift out of sync with what the CMS is writing.
    const KINDS_URL = 'https://script.google.com/a/macros/aguafria.org/s/AKfycbx13FWuxaxgD93A_wbfHU_j5EGBk_suTbQ-xcrYRx29mlIiNtFX0UDfhJsyBag9OdDR/exec?page=kinds';

    // Used only if the categories endpoint can't be reached (e.g. the viewer
    // isn't signed into their aguafria.org account) so the filter bar still
    // works with a reasonable default instead of breaking entirely.
    const FALLBACK_CATEGORIES = [
      { category: 'chatgpt', label: 'ChatGPT', color: '#14b8a6' },
      { category: 'canva', label: 'Canva', color: '#7c3aed' },
      { category: 'word', label: 'Word', color: '#2563eb' },
      { category: 'notebooklm', label: 'NotebookLM', color: '#000000' },
      { category: 'forms', label: 'Forms', color: '#16a34a' }
    ];

    /* ========================================================= */

    // Lets an embed override KINDS_SHOWN with ?kinds=usecase or
    // ?kinds=video,prompt. Falls back to the constant above when absent.
    const KINDS_ACTIVE = (function(){
      try {
        const raw = new URLSearchParams(window.location.search).get('kinds');
        if (!raw) return KINDS_SHOWN;
        if (raw.toLowerCase() === 'all') return 'all';
        const list = raw.split(',').map(function(k){ return k.trim().toLowerCase(); })
                        .filter(function(k){ return k; });
        return list.length ? list : KINDS_SHOWN;
      } catch (e) {
        return KINDS_SHOWN; // older browser, or no query string available
      }
    })();

    (function(){
      const carousel = document.getElementById('carousel');
      const controlsGroup = document.getElementById('controlsGroup');
      const filterNav = document.getElementById('filterNav');
      const viewAllBtn = document.getElementById('viewAllBtn');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      let filterBtns = document.querySelectorAll('.filter-btn');

      let autoTimer = null;
      let cardsData = [];

      // --- 0. BUILD CARD DOM FROM JSON ---
      function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, function(c){
          return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
        });
      }

      // --- Procedural gradient placeholder (used whenever a card has no image) ---
      // Seeded off the card's own title/id so a given card always gets the same
      // look instead of changing on every reload, and tinted from the category's
      // brand color so it stays visually consistent with the rest of the AI Hub —
      // in the same spirit as the soft abstract art ChatGPT uses in its marketing.
      let categoryColors = {}; // populated from the categories fetch, keyed by category
      let kindsById = {};      // populated from the kinds fetch, keyed by kind id

      function hashSeed(str) {
        let hash = 0;
        str = String(str || 'resource');
        for (let i = 0; i < str.length; i++) {
          hash = ((hash << 5) - hash) + str.charCodeAt(i);
          hash |= 0;
        }
        return Math.abs(hash);
      }

      function hexToHsl(hex) {
        hex = (hex || '#4A90D9').replace('#', '');
        if (hex.length === 3) hex = hex.split('').map(function(c){ return c + c; }).join('');
        const r = parseInt(hex.substr(0, 2), 16) / 255;
        const g = parseInt(hex.substr(2, 2), 16) / 255;
        const b = parseInt(hex.substr(4, 2), 16) / 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;
        if (max === min) {
          h = s = 0;
        } else {
          const d = max - min;
          s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
          if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
          else if (max === g) h = (b - r) / d + 2;
          else h = (r - g) / d + 4;
          h *= 60;
        }
        return { h: h, s: s * 100, l: l * 100 };
      }

      function hslToHex(h, s, l) {
        s /= 100; l /= 100;
        const k = function(n) { return (n + h / 30) % 12; };
        const a = s * Math.min(l, 1 - l);
        const f = function(n) { return l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); };
        const toHex = function(x) { return Math.round(255 * x).toString(16).padStart(2, '0'); };
        return '#' + toHex(f(0)) + toHex(f(8)) + toHex(f(4));
      }

      function generatePlaceholderImage(seedStr, baseHex) {
        const seed = hashSeed(seedStr);
        const base = hexToHsl(baseHex || '#4A90D9');
        const angle = seed % 360;
        const h1 = (base.h + 25 + (seed % 15)) % 360;
        const h2 = (base.h - 40 - ((seed >> 4) % 20) + 360) % 360;
        const s = Math.min(80, Math.max(45, base.s));
        const l1 = Math.min(70, Math.max(35, base.l));
        const l2 = Math.min(60, Math.max(22, base.l - 12));
        const c1 = hslToHex(h1, s, l1);
        const c2 = hslToHex(h2, s, l2);
        const c1Light = hslToHex(h1, s, Math.min(88, l1 + 15));
        const c2Light = hslToHex(h2, s, Math.min(85, l2 + 20));
        const cx1 = 15 + (seed % 40);
        const cy1 = 10 + ((seed >> 3) % 35);
        const cx2 = 55 + ((seed >> 6) % 35);
        const cy2 = 50 + ((seed >> 2) % 35);

        const svg =
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225">' +
            '<defs>' +
              '<linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%" gradientTransform="rotate(' + angle + ' 0.5 0.5)">' +
                '<stop offset="0%" stop-color="' + c1 + '"/>' +
                '<stop offset="100%" stop-color="' + c2 + '"/>' +
              '</linearGradient>' +
              '<filter id="b"><feGaussianBlur stdDeviation="28"/></filter>' +
            '</defs>' +
            '<rect width="400" height="225" fill="url(#g)"/>' +
            '<circle cx="' + cx1 + '%" cy="' + cy1 + '%" r="90" fill="' + c1Light + '" opacity="0.35" filter="url(#b)"/>' +
            '<circle cx="' + cx2 + '%" cy="' + cy2 + '%" r="110" fill="' + c2Light + '" opacity="0.3" filter="url(#b)"/>' +
          '</svg>';

        return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
      }

      // Sorts newest-first. Cards with a missing or unparseable date sink to
      // the bottom instead of breaking the sort or floating to the top.
      function sortByDateDesc(data) {
        if (!Array.isArray(data)) return data;
        return data.slice().sort(function(a, b){
          const dateA = a.date ? new Date(a.date).getTime() : NaN;
          const dateB = b.date ? new Date(b.date).getTime() : NaN;
          const timeA = isNaN(dateA) ? -Infinity : dateA;
          const timeB = isNaN(dateB) ? -Infinity : dateB;
          return timeB - timeA;
        });
      }

      // Narrows the pool to the kinds this particular embed should show. This
      // is the whole mechanism behind "on this page, only display use cases" —
      // one pool of resources, one filter, no separate data file.
      function filterByKind(list) {
        if (!Array.isArray(list)) return list;
        if (KINDS_ACTIVE === 'all' || !Array.isArray(KINDS_ACTIVE)) return list;

        const wanted = KINDS_ACTIVE.map(function(k){ return String(k).toLowerCase(); });
        return list.filter(function(c){
          // Missing kind counts as 'article' — that's what every record
          // written before kinds existed effectively was.
          return wanted.indexOf(String(c.kind || 'article').toLowerCase()) !== -1;
        });
      }

      function renderCards(data) {
        carousel.innerHTML = '';

        if (!Array.isArray(data) || data.length === 0) {
          carousel.innerHTML = '<div class="error-msg">No resources found.</div>';
          return;
        }

        data.forEach(function(item){
          const tool = (item.tool || '').toLowerCase();

          const card = document.createElement('div');
          card.className = 'card';
          card.setAttribute('data-tool', tool);

          const imageSrc = item.image || generatePlaceholderImage(item.title || item.id, categoryColors[tool]);

          // Only shown when the kind list actually loaded, so a failed fetch
          // degrades to the card looking exactly as it always has.
          const kindConfig = kindsById[String(item.kind || 'article').toLowerCase()];
          const kindBadge = (SHOW_KIND_BADGE && kindConfig)
            ? '<span class="kind-badge" style="background:' + escapeHtml(kindConfig.color || '#6b7280') + '">' + escapeHtml(kindConfig.label) + '</span>'
            : '';

          card.innerHTML =
            '<div class="card-media">' +
              '<img src="' + escapeHtml(imageSrc) + '" alt="">' +
              '<span class="badge" data-tool="' + escapeHtml(tool) + '">' + escapeHtml(item.badgeLabel || item.tool) + '</span>' +
              kindBadge +
            '</div>' +
            '<div class="card-body">' +
              '<h3 class="card-title">' + escapeHtml(item.title) + '</h3>' +
              '<p class="card-desc">' + escapeHtml(item.description) + '</p>' +
              '<a class="card-link" href="' + escapeHtml(item.link) + '" target="_blank">Learn more <span class="arrow">→</span></a>' +
            '</div>';

          carousel.appendChild(card);
        });
      }

      function buildFilterButtons(categories) {
        const buttons = ['<button class="filter-btn active" data-filter="all">All</button>'];
        categoryColors = {};
        categories.forEach(function(cat){
          buttons.push('<button class="filter-btn" data-filter="' + escapeHtml(cat.category) + '">' + escapeHtml(cat.label) + '</button>');
          categoryColors[cat.category] = cat.color;
        });
        filterNav.innerHTML = buttons.join('');
        filterBtns = document.querySelectorAll('.filter-btn'); // re-query — these buttons are freshly created
      }

      // --- 1. FETCH CATEGORIES (for the filter bar), THEN FETCH CARDS ---
      fetch(CATEGORIES_URL, { cache: 'no-store' })
        .then(function(res){
          if (!res.ok) throw new Error('Network response was not ok');
          return res.json();
        })
        .then(function(categories){
          buildFilterButtons(Array.isArray(categories) && categories.length ? categories : FALLBACK_CATEGORIES);
        })
        .catch(function(err){
          console.error('Failed to load categories, using fallback list:', err);
          buildFilterButtons(FALLBACK_CATEGORIES);
        })
        .then(function(){
          // Non-blocking: if the kind list can't be reached the cards still
          // render, just without kind badges.
          return fetch(KINDS_URL, { cache: 'no-store' })
            .then(function(res){ return res.ok ? res.json() : null; })
            .then(function(kinds){
              const list = (Array.isArray(kinds) && kinds.length) ? kinds : FALLBACK_KINDS;
              list.forEach(function(k){ kindsById[k.kind] = k; });
            })
            .catch(function(err){
              console.error('Failed to load kinds, using fallback list:', err);
              FALLBACK_KINDS.forEach(function(k){ kindsById[k.kind] = k; });
            });
        })
        .then(loadCards);

      function loadCards() {
        fetch(CARDS_JSON_URL, { cache: 'no-store' })
          .then(function(res){
            if (!res.ok) throw new Error('Network response was not ok');
            return res.json();
          })
          .then(function(data){
            // Drafts are saved but not yet published — keep them off the public
            // listing. Cards with no status at all predate this field, so they're
            // treated as published (nothing existing gets hidden by accident).
            const publishedOnly = Array.isArray(data) ? data.filter(function(c){ return c.status !== 'draft'; }) : data;
            cardsData = sortByDateDesc(filterByKind(publishedOnly));
            renderCards(cardsData);
            setupUI();
            applyFilter(INITIAL_CATEGORY);
          })
          .catch(function(err){
            carousel.innerHTML = '<div class="error-msg">Could not load resources right now. Please try again later.</div>';
            console.error('Failed to load cards.json:', err);
          });
      }

      function setupUI() {
        if (MODE === 'grid') {
          carousel.classList.add('is-grid');
          controlsGroup.style.display = 'none';
          document.body.style.overflowY = 'auto';
        } else {
          viewAllBtn.href = VIEW_ALL_URL;
          startAuto();
        }

        if (!SHOW_FILTER_NAV && filterNav) {
          filterNav.style.display = 'none';
        }

        filterBtns.forEach(function(btn){
          btn.addEventListener('click', function(){
            applyFilter(btn.dataset.filter);
          });
        });

        if (MODE === 'carousel') {
          nextBtn.addEventListener('click', function(e){ e.preventDefault(); stopAuto(); goNext(); startAuto(); });
          prevBtn.addEventListener('click', function(e){ e.preventDefault(); stopAuto(); goPrev(); startAuto(); });
          carousel.addEventListener('mouseenter', stopAuto);
          carousel.addEventListener('mouseleave', startAuto);
        }
      }

      // --- 2. FILTER LOGIC ---
      function applyFilter(category) {
        stopAuto();

        filterBtns.forEach(function(btn){
          if (btn.dataset.filter === category) btn.classList.add('active');
          else btn.classList.remove('active');
        });

        const cards = carousel.querySelectorAll('.card');
        cards.forEach(function(card){
          const badge = card.querySelector('.badge');
          const cardTool = card.getAttribute('data-tool') || (badge ? badge.getAttribute('data-tool') : '');
          const cleanTool = (cardTool || '').toLowerCase();
          const cleanCategory = category.toLowerCase();

          if (cleanCategory === 'all' || cleanTool === cleanCategory) {
            card.classList.remove('hidden');
          } else {
            card.classList.add('hidden');
          }
        });

        carousel.scrollTo({ left: 0, top: 0 });

        if (MODE === 'carousel') startAuto();
      }

      // --- 3. SCROLL & AUTOPLAY LOGIC ---
      function getScrollAmount() {
        const card = carousel.querySelector('.card:not(.hidden)');
        return card ? card.offsetWidth + 16 : 300;
      }

      function goNext() {
        const maxScroll = carousel.scrollWidth - carousel.clientWidth;
        if (carousel.scrollLeft >= maxScroll - 10) {
          carousel.scrollTo({ left: 0, behavior: 'smooth' });
        } else {
          carousel.scrollBy({ left: getScrollAmount(), behavior: 'smooth' });
        }
      }

      function goPrev() {
        if (carousel.scrollLeft <= 10) {
          carousel.scrollTo({ left: carousel.scrollWidth, behavior: 'smooth' });
        } else {
          carousel.scrollBy({ left: -getScrollAmount(), behavior: 'smooth' });
        }
      }

      function startAuto() {
        stopAuto();
        autoTimer = setInterval(goNext, 5000);
      }
      function stopAuto() {
        if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
      }

    })();
  </script>

</body>
</html>
